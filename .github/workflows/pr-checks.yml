name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm ci --prefix mobile_app
      - run: npm test
      - run: node --experimental-strip-types --test scripts/diagnostics/*.test.ts
      - run: npm run lint
      - run: npm run build
      - run: npm run build --prefix mobile_app
