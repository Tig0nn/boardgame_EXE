<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PlayBoard — Cờ Tỷ Phú Tài Chính</title>
    <!-- iOS Safari PWA Standalone Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayBoard" />
    <script>
      (function() {
        if (window.location.hostname.endsWith('.github.io')) {
          var p = window.location.pathname;
          var segs = p.split('/').filter(Boolean);
          if (segs.length === 1 && !p.endsWith('/')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%BASE_URL%assets/cropped/app-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
