name: exe-backend-v2c2

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: exe_v1
      POSTGRES_DB: exe_v1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "exe_v1", "-d", "exe_v1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
